name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install go-winres
        run: |
          go install github.com/tc-hib/go-winres@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gofmt
        run: |
          files=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$files" ]; then
            echo "not gofmt-clean:"; echo "$files"; exit 1
          fi

      - name: Vet (windows target)
        run: GOOS=windows GOARCH=amd64 go vet -unsafeptr=false ./...

      - name: Tests
        run: go test ./internal/...

      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.$(git rev-list --count HEAD).0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION (tag v$VERSION)"

      - name: Build
        run: make build VERSION="${{ steps.v.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yalauncher-windows-amd64
          path: build/YALauncher.exe
          if-no-files-found: error

      - name: Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp build/YALauncher.exe dist/YALauncher.exe
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/YALauncher.exe --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "YALauncher ${{ steps.v.outputs.version }}" \
              --generate-notes \
              dist/YALauncher.exe
          fi
          echo "released $TAG"
